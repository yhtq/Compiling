name:                Compiling
version:             0.1.0.0
github:              "githubuser/Compiling"
license:             BSD-3-Clause
author:              "yhtq"
maintainer:          "yhtq@example.com"
copyright:           "2026 yhtq"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/githubuser/Compiling#readme>

dependencies:
- base >= 4.7 && < 5
- vector
- data-effects-core
- heftia-effects
- text
- co-log
- hspec
- QuickCheck
- hashmap
- unicode-show
- containers

language: GHC2024
default-extensions: LambdaCase,
    OverloadedStrings,
    DerivingStrategies,
    DataKinds,
    TypeFamilies,
    BlockArguments,
    FunctionalDependencies,
    RecordWildCards,
    DefaultSignatures,
    PatternSynonyms,
    TemplateHaskell,
    PartialTypeSignatures,
    AllowAmbiguousTypes,
    DuplicateRecordFields,
    OverloadedRecordDot,
    LambdaCase,
    ImplicitParams

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src
  # exposed-modules:
  #   Effect,
  #   Lexer,
  #   Stream

executables:
  Compiling-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - Compiling

tests:
  Compiling-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - Compiling
